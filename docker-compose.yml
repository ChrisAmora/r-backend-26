services:
  api1:
    image: christianoamora/r-backend-26-api@sha256:6aa0e3397f8e35a1d78105da3200f476e8d8aa451535804c14720b438e1829a5
    restart: unless-stopped
    cpuset: "0"
    environment:
      RINHA_SOCKET: /sockets/api1.sock
      RINHA_C_KD_CHROMATIC: "1"
      RINHA_C_KD_PREFETCH_DIST: "0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.49"
          memory: "160MB"

  api2:
    image: christianoamora/r-backend-26-api@sha256:6aa0e3397f8e35a1d78105da3200f476e8d8aa451535804c14720b438e1829a5
    restart: unless-stopped
    cpuset: "1"
    environment:
      RINHA_SOCKET: /sockets/api2.sock
      RINHA_C_KD_CHROMATIC: "1"
      RINHA_C_KD_PREFETCH_DIST: "0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.49"
          memory: "160MB"

  lb:
    image: christianoamora/r-backend-26-lb@sha256:6d49ae2a11f032b96daa8064e8998d44f94f5f61faa13b2a12d1532acc756413
    restart: unless-stopped
    cpuset: "2,3"
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.02"
          memory: "30MB"

volumes:
  sockets:
